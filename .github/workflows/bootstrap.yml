name: Yuki Lockdown • Bootstrap & Android
on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      device_tests:
        description: Run disposable API 35 emulator persistence tests
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: yuki-${{ github.ref }}
  cancel-in-progress: false
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SOURCE_PAYLOAD_SHA256: fe81ff97c90a5ab1d27e693c08d485b42551c3d799cc781b88fbe8f4e1618181
      TARGET_BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Validate and install initial package
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          """Guarded room dialogue update. The bundled workflow must be uploaded manually."""
          import hashlib,json,os,re,shutil,stat,subprocess,tempfile,zipfile
          from pathlib import Path,PurePosixPath
          ARCHIVE='yuki-lockdown-source-v1.6.0.zip'
          MARKER='.yuki-bootstrap.json'
          WORKFLOW='.github/workflows/bootstrap.yml'
          ROOTS={'app','assets','tools','PROJECT_HANDOFF','gradle','gradlew','gradlew.bat','settings.gradle','build.gradle','gradle.properties','README.md','.gitignore'}
          REQUIRED={'app/build.gradle','app/src/main/AndroidManifest.xml','app/src/main/java/com/mavyy/yukilockdown/MiniYukiView.java','app/src/main/java/com/mavyy/yukilockdown/CompanionSize.java','app/src/main/res/drawable-nodpi/yuki_adult_kiss_03.png','app/src/main/res/drawable-nodpi/yuki_adult_carry_00.png','app/src/main/java/com/mavyy/yukilockdown/IdleYukiDrawable.java','app/src/main/java/com/mavyy/yukilockdown/CompanionWalk.java','gradlew','settings.gradle','tools/room_baseline.json','app/src/main/java/com/mavyy/yukilockdown/RoomScene.java','app/src/main/java/com/mavyy/yukilockdown/RoomPanel.java','app/src/main/java/com/mavyy/yukilockdown/RoomDialogue.java','app/src/main/java/com/mavyy/yukilockdown/RoomFormState.java','app/src/main/res/drawable-nodpi/yuki_room.png'}
          def blob(data):return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          def payload_hash(z):
           h=hashlib.sha256()
           for n in sorted(i.filename for i in z.infolist() if i.filename!=WORKFLOW):
            h.update(n.encode()+b'\0'+hashlib.sha256(z.read(n)).digest())
           return h.hexdigest()
          def install(root,expected):
           root=Path(root).resolve();marker=root/MARKER
           if marker.is_symlink():raise ValueError('Symbolic marker refused')
           if marker.is_file() and json.loads(marker.read_text()).get('payload_sha256')==expected:
            if not all((root/n).is_file() for n in REQUIRED):raise ValueError('Expanded source incomplete')
            print('Yuki room update installed: building current source; ZIP ignored.');return []
           archive=root/ARCHIVE
           if not archive.is_file() or archive.is_symlink():raise ValueError('Upload '+ARCHIVE+' to repository root')
           with zipfile.ZipFile(archive) as z:
            infos=z.infolist();names=set();folded=set()
            if len(infos)>5000 or sum(i.file_size for i in infos)>100*1024*1024:raise ValueError('Archive too large')
            for i in infos:
             n=i.filename;p=PurePosixPath(n)
             if not n or p.is_absolute() or str(p)!=n or '..' in p.parts or not re.fullmatch(r'[A-Za-z0-9_./-]+',n):raise ValueError('Unsafe path: '+n)
             if n!=WORKFLOW and (p.parts[0] not in ROOTS or any(x in {'.git','.github'} for x in p.parts) or n.lower().endswith('.zip')):raise ValueError('Forbidden path: '+n)
             if i.is_dir() or stat.S_IFMT(i.external_attr>>16) not in (0,stat.S_IFREG):raise ValueError('Only regular files accepted')
             if n.casefold() in folded:raise ValueError('Duplicate path: '+n)
             folded.add(n.casefold())
             if n!=WORKFLOW:names.add(n)
            if not REQUIRED<=names or z.testzip() is not None:raise ValueError('Incomplete source archive')
            if payload_hash(z)!=expected:raise ValueError('Payload checksum mismatch')
            baseline=json.loads(z.read('tools/room_baseline.json'))['files']
            if not marker.is_file() or not (root/'app').is_dir():raise ValueError('Requires existing bootstrapped Yuki Lockdown app')
            for n in names:
             dest=root/n
             if any(p.is_symlink() for p in [dest,*dest.parents]):raise ValueError('Symlink destination: '+n)
             if dest.exists() and not dest.is_file():raise ValueError('Non-file destination: '+n)
             if dest.exists():
              if blob(dest.read_bytes()) not in {baseline.get(n),blob(z.read(n))}:raise ValueError('Owner/source edits detected: '+n)
             elif n in baseline:raise ValueError('Baseline file missing: '+n)
            with tempfile.TemporaryDirectory() as td:
             for n in sorted(names):
              staged=Path(td)/n;staged.parent.mkdir(parents=True,exist_ok=True);staged.write_bytes(z.read(n))
             for n in sorted(names):
              dest=root/n;dest.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(Path(td)/n,dest)
           (root/'gradlew').chmod(0o755)
           marker.write_text(json.dumps({'version':8,'archive':ARCHIVE,'payload_sha256':expected},indent=2)+'\n')
           return sorted(names)+[MARKER]
          if __name__=='__main__':
           files=install(Path.cwd(),os.environ['SOURCE_PAYLOAD_SHA256'])
           if files:subprocess.run(['git','add','--force','--',*files],check=True)
          PYTHON
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Bootstrap safety tests
        run: |
          python3 tools/test_bootstrap.py
          python3 tools/test_update.py
          python3 tools/test_pocket_update.py
          python3 tools/test_mini_update.py
          python3 tools/test_mature_update.py
          python3 tools/test_idle_update.py
          python3 tools/test_home_update.py
          python3 tools/test_room_update.py
      - name: Build, unit tests and lint
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug assembleDebugAndroidTest
      - name: Enable KVM for optional device tests
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.device_tests }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Optional disposable device tests
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.device_tests }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          script: ./gradlew --no-daemon connectedDebugAndroidTest
      - name: Commit validated source and push
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$(git diff --cached --name-only -- .github/workflows)" ]; then
            echo 'Refusing to commit workflow modifications'; exit 1
          fi
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Update Yuki Lockdown v1.6.0 [skip ci]'
            git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          fi
          commit=$(git rev-parse HEAD)
          echo "Verified source commit: $commit" >> "$GITHUB_STEP_SUMMARY"
          echo 'Download yuki-lockdown-debug-APK, unzip on your phone, and install app-debug.apk. Real-device acceptance remains pending.' >> "$GITHUB_STEP_SUMMARY"
          echo "$commit" > app/build/outputs/apk/debug/VERIFIED_SOURCE_COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: yuki-lockdown-debug-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/VERIFIED_SOURCE_COMMIT.txt
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yuki-lockdown-validation
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
