plugins { id 'com.android.application' }
android {
 namespace 'com.mavyy.yukilockdown'
 compileSdk 35
 defaultConfig { applicationId 'com.mavyy.yukilockdown'; minSdk 26; targetSdk 35; versionCode 4; versionName '1.3.0'; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 signingConfigs { debug { storeFile rootProject.file('tools/development.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } }
 buildTypes { release { minifyEnabled false } }
 lint { abortOnError true }
}
dependencies {
 testImplementation 'junit:junit:4.13.2'
 androidTestImplementation 'androidx.test:runner:1.6.2'
 androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
